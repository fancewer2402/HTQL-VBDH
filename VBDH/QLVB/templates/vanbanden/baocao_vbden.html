{% load static %}
{% block content %}
<style>
    .container {
      margin: 30px auto;
      width: 95%;
      font-family: Arial, sans-serif;
    }

    .btn-blue {
      background-color: #2b579a;
      color: #fff;
      border: none;
      padding: 6px 15px;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-blue:hover { background-color: #1e4e79; }

    .btn-gray {
      background-color: #dcdcdc;
      border: 1px solid #aaa;
      padding: 6px 15px;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .btn-gray:hover {
      background-color: #ccc;
      color: inherit;
      text-decoration: none;
    }

    .header-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .title {
      border-bottom: 2px solid #1e4e79;
      font-size: 20px;
      font-weight: bold;
      padding-bottom: 5px;
      margin-bottom: 20px;
      color: #1e4e79;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 6px 10px;
      vertical-align: top;
    }

    label {
      font-weight: bold;
    }

    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid #999;
      padding: 5px;
      border-radius: 3px;
      background-color: #f9f9f9;
    }

    textarea {
      height: 60px;
      resize: none;
    }

    .right-panel {
      border-left: 1px solid #ccc;
      padding-left: 25px;
      width: 30%;
      vertical-align: top;
    }

    .footer-btn {
      margin-top: 20px;
    }

    .info-box {
      margin-bottom: 15px;
    }
</style>

<div class="container">
    <div class="header-buttons">
        <div>
            <button class="btn-gray" onclick="window.location.href='{% url 'danh_sach_van_ban_den' %}'">
                ← Quay lại
            </button>
        </div>
        <div>Trạng thái: {{ vb.TrangThai }}</div>
        <button class="btn-gray" onclick="window.location.href='{% url 'nhatkyhoatdong' 'vanbanden' vb.id %}'">
            Xem nhật ký hoạt động
        </button>
    </div>

    <div class="title">XÁC NHẬN PHÂN CÔNG XỬ LÝ VĂN BẢN ĐẾN</div>

    <form method="post">
        {% csrf_token %}
        <table style="width:100%;">
            <tr>
                <!-- ====== CỘT TRÁI: THÔNG TIN VĂN BẢN ====== -->
                <td style="width: 65%; vertical-align: top;">
                    <table style="width:100%;">
                        <tr><td style="width:25%;"><label>Trích yếu:</label></td><td><textarea readonly>{{ vb.TrichYeu }}</textarea></td></tr>
                        <tr><td><label>Số ký hiệu:</label></td><td><input type="text" readonly value="{{ vb.SoKyHieu }}"></td></tr>
                        <tr><td><label>Loại văn bản:</label></td><td><input type="text" readonly value="{{ vb.LoaiVanBan }}"></td></tr>
                        <tr><td><label>Độ mật:</label></td><td><input type="text" readonly value="{{ vb.DoMat }}"></td></tr>
                        <tr><td><label>Độ khẩn:</label></td><td><input type="text" readonly value="{{ vb.DoKhan }}"></td></tr>
                        <tr><td><label>Đơn vị phát hành:</label></td><td><input type="text" readonly value="{{ vb.CoQuanBanHanh }}"></td></tr>
                        <tr><td><label>Ngày phát hành:</label></td><td><input type="text" readonly value="{{ vb.NgayBanHanh }}"></td></tr>
                        <tr><td><label>Ngày đến:</label></td><td><input type="text" readonly value="{{ vb.NgayDen }}"></td></tr>
                        <tr><td><label>Phòng ban:</label></td><td><input type="text" readonly value="{{ vb.PhongBan }}"></td></tr>
                        <tr><td><label>Nội dung:</label></td><td><textarea readonly>{{ vb.NoiDung }}</textarea></td></tr>
                        <tr>
                            <td><label>Tệp đính kèm:</label></td>
                            <td>
                                {% if vb.TepDinhKem %}
                                <a href="{{ vb.TepDinhKem.url }}" target="_blank">{{ vb.TepDinhKem.name }}</a>
                                {% else %}
                                <input type="text" readonly value="Không có tệp đính kèm">
                                {% endif %}
                            </td>
                        </tr>
                    </table>
                </td>

                <!-- ====== CỘT PHẢI: XÁC NHẬN PHÂN CÔNG ====== -->
                <td class="right-panel">
                    <div class="info-box">
                        <label>Phòng ban:</label>
                        <input type="text" readonly value="{{ vb.PhongBan }}">
                    </div>

                    <div class="info-box">
                        <label>Nhân viên được phân công:</label>
                        <input type="text" readonly value="{{ nhanvien.HoTen }}">
                    </div>

                    <div class="info-box">
                        <label>Yêu cầu văn bản đi:</label>
                        <input type="text" readonly value="{% if vb.YeuCauVanBanDi %}Có{% else %}Không{% endif %}">
                    </div>

                    <div class="info-box">
                        <label>Nội dung phân công:</label>
                        <textarea readonly>{{ vb.NoiDungPhanCong }}</textarea>
                    </div>

                    <div class="info-box">
                        <label>Hạn cuối xử lý:</label>
                        <input type="text" readonly value="{{ vb.HanCuoi }}">
                    </div>

                    <div class="footer-btn">
                        <button type="submit" name="action" value="complete" class="btn-blue">Hoàn thành</button>
                    </div>
                </td>
            </tr>
        </table>
    </form>
</div>
{% endblock %}
