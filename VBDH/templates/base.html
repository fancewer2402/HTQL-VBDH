{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quản lý văn bản{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Font Awesome (để có icon đẹp) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #fff;
        }


        /* Thanh menu */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: #f8f8f8;
            padding: 10px 15px;
            border-bottom: 1px solid #ccc;
        }


        .navbar img.logo {
            height: 50px;
            margin-right: 20px;
        }


        .navbar button {
            background: linear-gradient(to bottom, #2a6df4, #0050a0);
            border: 1px solid #333;
            color: white;
            padding: 10px 25px;
            cursor: pointer;
            margin-right: 10px;
            border-radius: 4px;
        }


        .navbar button.active {
            background: #1E90FF;
            color: #fff;
            font-weight: bold;
        }


        /* Biểu tượng thông báo */
        .notification {
            margin-left: auto;
            margin-right: 15px;
            position: relative;
            cursor: pointer;
        }


        .notification .bell {
            font-size: 22px;
            color: #333;
        }


        .notification .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            font-size: 11px;
            border-radius: 50%;
            padding: 2px 5px;
        }


        .logout {
           position: relative;
           display: inline-block;
        }

       .logout-icon {
           font-size: 22px;
           color: #333;
           cursor: pointer;
       }

       /* Nút đăng xuất: ẩn bằng opacity và pointer-events */
       .logout-button {
           position: absolute;
           top: 100%;
           left: 50%;
           transform: translateX(-50%);
           background-color: #000;
           color: white;
           padding: 8px 14px;
           border-radius: 4px;
           text-decoration: none;
           font-size: 14px;
           opacity: 0;
           pointer-events: none;
           transition: opacity 0.3s ease;
           white-space: nowrap;
           z-index: 1000;
       }

       /* Khi hover vào logout (icon hoặc button), thì hiện nút */
       .logout:hover .logout-button {
           opacity: 1;
           pointer-events: auto;
       }

        hr {
            border: none;
            border-top: 1px solid #000;
            margin: 10px 0;
        }

    </style>
</head>
<body>


<!-- Thanh menu -->
<div class="navbar">
    <!-- Logo -->
    <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">


    <!-- Các nút -->
    <button href="" class="{% block btn_incoming %}{% endblock %}">Văn bản đến</button>
    <button href="{% url 'vanbandi' %}" class="{% block btn_outgoing %}{% endblock %}">Văn bản đi</button>


    <!-- Biểu tượng thông báo -->
    <div class="notification">
        <i class="fa-solid fa-bell"></i>


    </div>


    <!-- Biểu tượng đăng xuất và nút -->
    <div class="logout">
        <div class="logout-area">
            <i class="fa-solid fa-right-from-bracket logout-icon"></i>
            <a href="{% url 'login' %}" class="logout-button">Đăng xuất</a>
        </div>
    </div>

</div>


<hr>


<!-- Nội dung -->
<div class="content">
    {% block content %}{% endblock %}
</div>


</body>
</html>
