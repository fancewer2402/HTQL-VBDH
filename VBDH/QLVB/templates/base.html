{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{% block title %}Quản lý văn bản{% endblock %}</title>
   <link rel="stylesheet" href="{% static 'css/style.css' %}">
   <style>
       body {
           font-family: Arial, sans-serif;
           margin: 20px;
           background: #fff;
       }
       /* Thanh menu */
       .navbar {
           display: flex;
           justify-content: flex-start;
           align-items: center;
       }
       .navbar button {
           background: linear-gradient(to bottom, #2a6df4, #0050a0);
           border: 1px solid #333;
           color: white;
           padding: 10px 25px;
           cursor: pointer;
       }
       .navbar button.active {
           background: #1E90FF;
           color: #fff;
           font-weight: bold;
       }
       .logout {
           margin-left: auto;
       }


       .logout button {
           background: #f5f5f5;
           border: 1px solid #666;
           padding: 8px 15px;
           cursor: pointer;
           color: black;
       }
       /* Kẻ ngang */
       hr {
           border: none;
           border-top: 1px solid #000;
           margin: 10px 0;
       }
       /* Form tìm kiếm và lọc */
       .filters {
           margin: 15px 0;
       }
       .filters input,
       .filters select,
       .filters button {
           padding: 5px;
           margin: 5px;
       }
       .filters button {
           cursor: pointer;
       }
       /* Bảng dữ liệu */
       table {
           width: 100%;
           border-collapse: collapse;
           margin-top: 15px;
       }
       th, td {
           border: 1px solid #000;
           padding: 6px 8px;
           text-align: left;
       }
       th {
           background: #f2f2f2;
       }
       /* Phân trang */
       .pagination {
           text-align: center;
           margin-top: 10px;
       }
       .pagination a {
           border: 1px solid #000;
           margin: 0 3px;
           padding: 3px 8px;
           text-decoration: none;
           color: black;
       }
       .pagination a.active {
           background: #1E90FF;
           color: white;
       }
   </style>
</head>
<body>


   <!-- Thanh menu -->
   <div class="navbar">
       <button class="{% block btn_incoming %}{% endblock %}">Văn bản đến</button>
       <button class="{% block btn_outgoing %}{% endblock %}">Văn bản đi</button>
       <div class="logout">
           <button>Đăng xuất</button>
       </div>
   </div>
   <hr>


   <!-- Nội dung -->
   <div class="content">
       {% block content %}{% endblock %}
   </div>


   <!-- Phân trang -->
   <div class="pagination">
       {% block pagination %}
       <a href="#">&lt;</a>
       <a href="#" class="active">1</a>
       <a href="#">2</a>
       <a href="#">3</a>
       <a href="#">4</a>
       <a href="#">5</a>
       <a href="#">&gt;</a>
       {% endblock %}
   </div>


</body>
</html>
