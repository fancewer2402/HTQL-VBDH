{% load static %}
{% block content %}
<style>
    .container {
      margin: 30px auto;
      width: 95%;
      font-family: Arial, sans-serif;
    }

    .btn-blue {
      background-color: #2b579a;
      color: #fff;
      border: none;
      padding: 6px 15px;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-blue:hover { background-color: #1e4e79; }

    .btn-gray {
      background-color: #dcdcdc;
      border: 1px solid #aaa;
      padding: 6px 15px;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .btn-gray:hover {
      text-decoration: none;
      color: inherit;
    }

    .header-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .title {
      border-bottom: 2px solid #1e4e79;
      font-size: 20px;
      font-weight: bold;
      padding-bottom: 5px;
      margin-bottom: 20px;
      color: #1e4e79;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 6px 10px;
      vertical-align: top;
    }

    label {
      font-weight: bold;
    }

    input[type="text"], input[type="datetime-local"], textarea, select {
      width: 100%;
      border: 1px solid #999;
      padding: 5px;
      border-radius: 3px;
    }

    textarea {
      height: 60px;
      resize: none;
    }

    .right-panel {
      border-left: 1px solid #ccc;
      padding-left: 25px;
      width: 30%;
    }

    .footer-btn {
      margin-top: 20px;
    }

</style>

<div class="container">
    <!-- ====== HEADER BUTTONS ====== -->
    <div class="header-buttons">
        <div>
            <button class="btn-gray" onclick="window.location.href='{% url 'danh_sach_van_ban_den' %}'">
                ← Quay lại
            </button>
        </div>
        <div>Trạng thái:</div>
        <button class="btn-gray" onclick="window.location.href='{% url 'nhatkyhoatdong' 'vanbanden' vb.id %}'">
            Xem nhật ký hoạt động
        </button>
    </div>

    <div class="title">PHÂN CÔNG XỬ LÝ VĂN BẢN ĐẾN</div>

    <form method="post">
        {% csrf_token %}
        <table style="width:100%;">
            <tr>
                <!-- ====== CỘT TRÁI: THÔNG TIN VĂN BẢN ====== -->
                <td style="width: 65%; vertical-align: top;">
                    <table style="width:100%;">
                        <tr>
                            <td style="width: 25%;"><label>Trích yếu (*):</label></td>
                            <td><textarea readonly>{{ vb.TrichYeu }}</textarea></td>
                        </tr>
                        <tr>
                            <td><label>Số ký hiệu (*):</label></td>
                            <td><input type="text" readonly value="{{ vb.SoKyHieu }}"></td>
                        </tr>
                        <tr>
                            <td><label>Loại văn bản:</label></td>
                            <td><input type="text" readonly value="{{ vb.LoaiVanBan }}"></td>
                        </tr>
                        <tr>
                            <td><label>Độ mật:</label></td>
                            <td><input type="text" readonly value="{{ vb.DoMat }}"></td>
                        </tr>
                        <tr>
                            <td><label>Độ khẩn:</label></td>
                            <td><input type="text" readonly value="{{ vb.DoKhan }}"></td>
                        </tr>
                        <tr>
                            <td><label>Đơn vị phát hành:</label></td>
                            <td><input type="text" readonly value="{{ vb.CoQuanBanHanh }}"></td>
                        </tr>
                        <tr>
                            <td><label>Ngày phát hành:</label></td>
                            <td><input type="text" readonly value="{{ vb.NgayBanHanh }}"></td>
                        </tr>
                        <tr>
                            <td><label>Ngày đến:</label></td>
                            <td><input type="text" readonly value="{{ vb.NgayDen }}"></td>
                        </tr>
                        <tr>
                            <td><label>Phòng ban:</label></td>
                            <td><input type="text" readonly value="{{ vb.PhongBan }}"></td>
                        </tr>
                        <tr>
                            <td><label>Nội dung:</label></td>
                            <td><textarea readonly>{{ vb.NoiDung }}</textarea></td>
                        </tr>
                        <tr>
                            <td><label>Tệp đính kèm:</label></td>
                            <td>
                                {% if vb.TepDinhKem %}
                                <a href="{{ vb.TepDinhKem.url }}" target="_blank">{{ vb.TepDinhKem.name }}</a>
                                {% else %}
                                <input type="text" readonly value="Không có tệp đính kèm">
                                {% endif %}
                            </td>
                        </tr>
                    </table>
                </td>

                <!-- ====== CỘT PHẢI: PHÂN CÔNG XỬ LÝ ====== -->
                <td class="right-panel" valign="top">
                    <div class="field-group">
                        <label>Phòng ban:</label>
                        <select name="phong_ban" id="phong-ban-select" required>
                            <option value="">-- Chọn phòng ban --</option>
                            {% for pb in phong_ban_list %}
                            <option value="{{ pb.id }}">{{ pb.ten_phong_ban }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field-group" style="margin-top: 15px;">
                        <label>Nhân viên:</label>
                        <select name="nhan_vien" id="nhan-vien-select" required>
                            <option value="">-- Chọn nhân viên --</option>
                            {% for nv in nhan_vien_list %}
                            <option value="{{ nv.id }}" data-phong="{{ nv.phong_ban_id }}">{{ nv.ho_ten }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field-group" style="margin-top: 15px;">
                        <label>Yêu cầu văn bản đi:</label>
                        <select name="yeu_cau_vbdi">
                            <option value="">-- Chọn --</option>
                            <option value="1">Có</option>
                            <option value="0">Không</option>
                        </select>
                    </div>

                    <div class="field-group" style="margin-top: 15px;">
                        <label>Nội dung phân công:</label>
                        <textarea name="noi_dung" placeholder="Nhập nội dung phân công..." required></textarea>
                    </div>

                    <div class="field-group" style="margin-top: 15px;">
                        <label>Hạn cuối xử lý:</label>
                        <input type="datetime-local" name="han_cuoi" required>
                    </div>

                    <div class="footer-btn">
                        <button type="submit" class="btn-blue">Phân công</button>
                    </div>
                </td>
            </tr>
        </table>
    </form>
</div>

<script>
    // Lọc nhân viên theo phòng ban được chọn
    const phongBanSelect = document.getElementById('phong-ban-select');
    const nhanVienSelect = document.getElementById('nhan-vien-select');

    phongBanSelect.addEventListener('change', function() {
        const phongId = this.value;
        for (let option of nhanVienSelect.options) {
            if (!option.value) continue;
            option.style.display = (option.dataset.phong === phongId) ? 'block' : 'none';
        }
        nhanVienSelect.value = '';
    });
</script>

{% endblock %}
