<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sửa văn bản đến</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      margin: 30px auto;
      width: 95%;
    }

    .btn-blue {
      background-color: #2b579a;
      color: #fff;
      border: none;
      padding: 6px 15px;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-gray {
      background-color: #dcdcdc;
      border: 1px solid #aaa;
      padding: 6px 15px;
      border-radius: 3px;
      cursor: pointer;
    }

    .header-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .title {
      border-bottom: 2px solid #1e4e79;
      font-size: 20px;
      font-weight: bold;
      padding-bottom: 5px;
      margin-bottom: 20px;
      color: #1e4e79;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 6px 10px;
      vertical-align: top;
    }

    label {
      font-weight: bold;
    }

    input[type="text"],
    input[type="date"],
    textarea,
    select {
      width: 100%;
      border: 1px solid #999;
      padding: 5px;
      border-radius: 3px;
      font-size: 14px;
    }

    textarea {
      height: 60px;
      resize: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-buttons">
      <div>
        <button class="btn-gray" onclick="window.history.back()">← Quay lại</button>
      </div>

      <div style="text-align: right;">
        <button type="submit" form="formSuaVB" class="btn-blue" style="margin-top: 8px;">💾 Lưu</button>
        <button class="btn-gray" style="margin-top: 5px;" onclick="window.history.back()">Hủy</button>
      </div>
    </div>

    <div class="title">SỬA VĂN BẢN ĐẾN</div>

    <form id="formSuaVB" method="post">
      {% csrf_token %}
      <table>
        <tr>
          <td style="width: 20%;"><label>Trích yếu (*):</label></td>
          <td style="width: 50%;"><textarea name="TrichYeu">{{ vb.TrichYeu }}</textarea></td>
        </tr>
        <tr>
          <td><label>Số ký hiệu (*):</label></td>
          <td><input type="text" name="SoKyHieu" value="{{ vb.SoKyHieu }}"></td>
        </tr>
        <tr>
          <td><label>Loại văn bản:</label></td>
          <td><input type="text" name="LoaiVanBan" value="{{ vb.LoaiVanBan }}"></td>
        </tr>
        <tr>
          <td><label>Độ mật:</label></td>
          <td><input type="text" name="DoMat" value="{{ vb.DoMat }}"></td>
        </tr>
        <tr>
          <td><label>Độ khẩn:</label></td>
          <td><input type="text" name="DoKhan" value="{{ vb.DoKhan }}"></td>
        </tr>
        <tr>
          <td><label>Đơn vị phát hành (*):</label></td>
          <td><input type="text" name="CoQuanBanHanh" value="{{ vb.CoQuanBanHanh }}"></td>
        </tr>
        <tr>
          <td><label>Ngày phát hành:</label></td>
          <td><input type="date" name="NgayBanHanh" value="{{ vb.NgayBanHanh|date:'Y-m-d' }}"></td>
        </tr>
        <tr>
          <td><label>Ngày đến:</label></td>
          <td><input type="date" name="NgayDen" value="{{ vb.NgayDen|date:'Y-m-d' }}"></td>
        </tr>
        <tr>
          <td><label>Phòng ban:</label></td>
          <td><input type="text" name="PhongBan" value="{{ vb.PhongBan }}"></td>
        </tr>
        <tr>
          <td><label>Nội dung:</label></td>
          <td><textarea name="NoiDung">{{ vb.NoiDung }}</textarea></td>
        </tr>
      </table>
    </form>
  </div>
</body>
</html>
