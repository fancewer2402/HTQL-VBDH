{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo văn bản đến</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background-color: #f8f9fa; margin:0; padding:0; }
        .navbar-custom { background:#fff; border-bottom:1px solid #dee2e6; padding:12px 25px; position:sticky; top:0; z-index:1000; }
        .navbar-custom h4 { color:#0d6efd; font-weight:600; margin:0; }
        .container-form { padding:30px 50px; }
        .form-box { background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); padding:30px; }
        .small-muted { font-size:0.9rem; color:#6c757d; }
    </style>
</head>

<body>

<nav class="navbar navbar-custom d-flex justify-content-between align-items-center">
    <button class="btn btn-outline-secondary" onclick="window.location.href='{% url 'danh_sach_van_ban_den' %}'">
        ← Quay lại
    </button>

    <h4 class="mb-0">Tạo văn bản đến</h4>

    <button type="submit" form="formVanBan" class="btn btn-success">
        <i class="fa-solid fa-save me-1"></i> Lưu &amp; Trình ký
    </button>
</nav>

<div class="container-fluid px-5 mt-3">
    <div id="errorAlert" class="alert alert-danger alert-dismissible fade d-none" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span id="errorMessage"></span>

        <button type="button" class="btn-close" onclick="hideError()" aria-label="Close"></button>
    </div>
    {% if messages %}
        {% for message in messages %}
            <div class="alert
                {% if message.tags == 'error' %}alert-danger
                {% elif message.tags == 'success' %}alert-success
                {% elif message.tags == 'warning' %}alert-warning
                {% else %}alert-info{% endif %}
                alert-dismissible fade show shadow-sm" role="alert">

                <i class="fa-solid
                    {% if message.tags == 'error' %}fa-circle-exclamation
                    {% elif message.tags == 'success' %}fa-circle-check
                    {% else %}fa-circle-info{% endif %}
                    me-2"></i>

                {{ message }}

                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<div class="container-form">
    <div class="form-box">

        <form id="formVanBan" method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="SoHieu" class="form-label">Số hiệu</label>
                    <input type="text" id="SoHieu" name="SoHieu" class="form-control"
                           value="{{ so_hieu_tu_dong }}" readonly>
                </div>
                <div class="col-md-6">
                    <label for="MaPhongBan" class="form-label">Phòng ban *</label>
                    <select id="MaPhongBan" name="MaPhongBan" class="form-select" required>
                        <option value="">-- Chọn phòng ban --</option>
                        {% for pb in phong_ban_list %}
                        <option value="{{ pb.id }}" {% if initial_data.MaPhongBan|slugify == pb.id|slugify %}selected{% endif %}>
                            {{ pb.TenPhongBan }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="TrichYeu" class="form-label">Trích yếu *</label>
                <textarea id="TrichYeu" name="TrichYeu" class="form-control" rows="3" required>{{ initial_data.Yeu|default_if_none:'' }}</textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="LoaiVBDen" class="form-label">Loại văn bản *</label>
                    <select id="LoaiVBDen" name="LoaiVBDen" class="form-select" required>
                        <option value="">-- Chọn loại văn bản --</option>
                        <option value="Hợp đồng">Hợp đồng</option>
                        <option value="Công văn">Công văn</option>
                        <option value="Thông báo">Thông báo</option>
                        <option value="Quyết định">Quyết định</option>
                        <option value="Chỉ thị">Chỉ thị</option>
                        <option value="Biên bản làm việc – nghiệm thu – bàn giao">Biên bản làm việc – nghiệm thu – bàn giao</option>
                        <option value="Tờ trình / Đề xuất">Tờ trình / Đề xuất</option>
                        <option value="Hồ sơ thương mại">Hồ sơ thương mại</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="NguoiNhanTrinhKy" class="form-label">Người nhận trình ký *</label>
                    <select id="NguoiNhanTrinhKy" name="NguoiNhanTrinhKy" class="form-select" required>
                        <option value="">-- Tùy chọn --</option>
                        {% for u in nhan_vien_list %}
                        <option value="{{ u.id }}" {% if initial_data.NguoiNhanTrinhKy|slugify == u.id|slugify %}selected{% endif %}>
                            {{ u.ho_ten }} (Mã: {{ u.id }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="DoKhan" class="form-label">Độ khẩn</label>
                   <select id="DoKhan" name="DoKhan" class="form-select">
                    {% for value, label in DOKHAN_CHOICES %}
                    <option value="{{ value }}" {% if initial_data.DoKhan|default:'BINH THUONG' == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
                </div>
                <div class="col-md-4">
                    <label for="DoMat" class="form-label">Độ mật</label>
                    <select id="DoMat" name="DoMat" class="form-select">
                        {% for value, label in DOMAT_CHOICES %}
                        <option value="{{ value }}" {% if initial_data.DoMat|default:'BINH THUONG' == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="DonViPhatHanh" class="form-label">Đơn vị ban hành *</label>
                    <input type="text" id="DonViPhatHanh" name="DonViPhatHanh" class="form-control" required value="{{ initial_data.DonViPhatHanh|default_if_none:'' }}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="NgayBanHanh" class="form-label">Ngày phát hành *</label>
                    <input type="date" id="NgayBanHanh" name="NgayBanHanh" class="form-control" required
                        value="{{ initial_data.NgayBanHanh|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label for="NgayDen" class="form-label">Ngày đến *</label>
                    <input type="date" id="NgayDen" name="NgayDen" class="form-control" required
                        value="{{ initial_data.NgayDen|default:'' }}">
                </div>
            </div>

            <div class="mb-3">
                <label for="NoiDung" class="form-label">Nội dung</label>
                <textarea id="NoiDung" name="NoiDung" class="form-control" rows="4">{{ initial_data.NoiDung|default_if_none:'' }}</textarea>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
            <label for="YeuCauVBDi" class="form-label">Yêu cầu tạo Văn bản đi</label>
            <select id="YeuCauVBDi" name="YeuCauVBDi" class="form-select">
                <option value="0" {% if initial_data.YeuCauVBDi == '0' %}selected{% endif %}>Không yêu cầu</option>
                <option value="1" {% if initial_data.YeuCauVBDi == '1' %}selected{% endif %}>Có yêu cầu</option>
            </select>
        </div>
                <div class="col-md-6">
                    </div>
            </div>
            <div class="mb-4">
                <label for="FileDinhKem" class="form-label">Tệp đính kèm</label>
                <div class="border rounded p-3 text-center bg-light">
                    <input type="file" id="FileDinhKem" name="FileDinhKem" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label for="nguoiTaoHienThi" class="form-label">Người tạo</label>

                <input
                    type="text"
                    id="nguoiTaoHienThi"
                    class="form-control"
                    value="{{ user.ho_ten|default:user.username }}"
                    disabled
                    readonly
                    style="background-color: #e9ecef; color: #495057;"
                >

                <input
                    type="hidden"
                    name="MaNhanVien"
                    value="{{ user.id }}"
                >
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showError(message) {
    const alertBox = document.getElementById("errorAlert");
    const msg = document.getElementById("errorMessage");

    msg.innerText = message;
    alertBox.classList.remove("d-none");
    alertBox.classList.add("show");
    // Cuộn tới thông báo lỗi
    alertBox.scrollIntoView({ behavior: "smooth", block: "center" });
}
function hideError() {
    const alertBox = document.getElementById("errorAlert");
    alertBox.classList.remove("show");
    alertBox.classList.add("d-none");
}
document.getElementById("formVanBan").addEventListener("submit", function(e) {

    const phongBan = document.getElementById("MaPhongBan").value;
    const trichYeu = document.getElementById("TrichYeu").value.trim();
    const loaiVb = document.getElementById("LoaiVBDen").value;
    const nguoiNhan = document.getElementById("NguoiNhanTrinhKy").value;
    const donViPhatHanh = document.getElementById("DonViPhatHanh").value.trim();
    const nb = document.getElementById("NgayBanHanh").value;
    const nd = document.getElementById("NgayDen").value;

    if (!phongBan) {
        e.preventDefault();
        showError("Vui lòng chọn phòng ban.");
        return;
    }

    if (trichYeu.length <= 5) {
        e.preventDefault();
        showError("Trích yếu phải lớn hơn 5 ký tự.");
        return;
    }

    if (!loaiVb) {
        e.preventDefault();
        showError("Vui lòng chọn loại văn bản.");
        return;
    }

    if (!nguoiNhan) {
        e.preventDefault();
        showError("Vui lòng chọn người nhận trình ký.");
        return;
    }

    if (!donViPhatHanh) {
        e.preventDefault();
        showError("Vui lòng nhập đơn vị phát hành.");
        return;
    }

    if (!nb) {
        e.preventDefault();
        showError("Vui lòng chọn ngày phát hành.");
        return;
    }

    if (!nd) {
        e.preventDefault();
        showError("Vui lòng chọn ngày đến.");
        return;
    }

    const ngayBanHanh = new Date(nb + "T00:00");
    const ngayDen = new Date(nd + "T00:00");

    const today = new Date();
    today.setHours(0,0,0,0);

    if (ngayBanHanh > today) {
        e.preventDefault();
        showError("Ngày phát hành không được lớn hơn ngày hiện tại.");
        return;
    }

    if (ngayDen > today) {
        e.preventDefault();
        showError("Ngày đến không được lớn hơn ngày hiện tại.");
        return;
    }

    if (ngayDen < ngayBanHanh) {
        e.preventDefault();
        showError("Ngày đến phải lớn hơn hoặc bằng ngày phát hành.");
        return;
    }
});
</script>
</body>
</html>
