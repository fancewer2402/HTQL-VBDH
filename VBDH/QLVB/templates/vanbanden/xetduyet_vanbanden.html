{% load static %}
{% block content %}
<style>
    .container {
      margin: 30px auto;
      width: 95%;
      font-family: Arial, sans-serif;
    }

    .btn-blue {
      background-color: #2b579a;
      color: #fff;
      border: none;
      padding: 6px 15px;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-blue:hover { background-color: #1e4e79; }

    .btn-gray {
      background-color: #dcdcdc;
      border: 1px solid #aaa;
      padding: 6px 15px;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .header-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .title {
      border-bottom: 2px solid #1e4e79;
      font-size: 20px;
      font-weight: bold;
      padding-bottom: 5px;
      margin-bottom: 20px;
      color: #1e4e79;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 6px 10px;
      vertical-align: top;
    }

    label {
      font-weight: bold;
    }

    input[type="text"], textarea, select, input[type="date"] {
      width: 100%;
      border: 1px solid #999;
      padding: 5px;
      border-radius: 3px;
    }

    textarea { height: 60px; resize: none; }

    .right-panel {
      border-left: 1px solid #ccc;
      padding-left: 25px;
      width: 30%;
    }

    .file-upload {
      border: 1px dashed #999;
      text-align: center;
      padding: 20px;
      color: #666;
      border-radius: 5px;
      cursor: pointer;
    }

    .file-upload:hover { background-color: #f9f9f9; }

    .footer-btn { margin-top: 20px; }

    .img-preview {
      margin-top: 10px;
      max-width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
</style>

<div class="container">
    <div class="header-buttons">
        <div>
            <button class="btn-gray" onclick="window.location.href='{% url 'danh_sach_van_ban_den' %}'">
                ← Quay lại
            </button>
        </div>
        <div>Trạng thái:</div>
        <button class="btn-gray" onclick="window.location.href='{% url 'nhatkyhoatdong' 'vanbanden' vb.id %}'">
            Xem nhật ký hoạt động
        </button>
    </div>

    <div class="title">XÉT DUYỆT & PHÂN CÔNG VĂN BẢN ĐẾN</div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table style="width:100%;">
            <tr>
                <td style="width: 65%; vertical-align: top;">

                    <!-- CỘT TRÁI -->
                    <table style="width:100%;">
                        <tr>
                            <td style="width: 25%;"><label>Trích yếu (*):</label></td>
                            <td><textarea readonly>{{ vb.TrichYeu }}</textarea></td>
                        </tr>

                        <tr>
                            <td><label>Số ký hiệu (*):</label></td>
                            <td><input type="text" readonly value="{{ vb.SoKyHieu }}"></td>
                        </tr>

                        <tr>
                            <td><label>Loại văn bản:</label></td>
                            <td><input type="text" readonly value="{{ vb.LoaiVanBan }}"></td>
                        </tr>

                        <tr>
                            <td><label>Độ mật:</label></td>
                            <td><input type="text" readonly value="{{ vb.DoMat }}"></td>
                        </tr>

                        <tr>
                            <td><label>Độ khẩn:</label></td>
                            <td><input type="text" readonly value="{{ vb.DoKhan }}"></td>
                        </tr>

                        <tr>
                            <td><label>Đơn vị phát hành (*):</label></td>
                            <td><input type="text" readonly value="{{ vb.CoQuanBanHanh }}"></td>
                        </tr>

                        <tr>
                            <td><label>Ngày phát hành:</label></td>
                            <td><input type="text" readonly value="{{ vb.NgayBanHanh }}"></td>
                        </tr>

                        <tr>
                            <td><label>Ngày đến:</label></td>
                            <td><input type="text" readonly value="{{ vb.NgayDen }}"></td>
                        </tr>

                        <tr>
                            <td><label>Phòng ban:</label></td>
                            <td><input type="text" readonly value="{{ vb.PhongBan }}"></td>
                        </tr>

                        <tr>
                            <td><label>Nội dung:</label></td>
                            <td><textarea readonly>{{ vb.NoiDung }}</textarea></td>
                        </tr>

                        <tr>
                            <td><label>Tệp đính kèm:</label></td>
                            <td>
                                {% if vb.TepDinhKem %}
                                    <a href="{{ vb.TepDinhKem.url }}" target="_blank">{{ vb.TepDinhKem.name }}</a>
                                {% else %}
                                    <input type="text" readonly value="Không có tệp đính kèm">
                                {% endif %}
                            </td>
                        </tr>
                    </table>
                </td>

                <!-- CỘT PHẢI -->
                <td class="right-panel" valign="top">

                    <!-- XÉT DUYỆT -->
                    <div class="field-group">
                        <label>Chữ ký:</label>
                        <div class="file-upload">
                            <input type="file" name="chu_ky" accept="image/*">
                        </div>

                        {% if vb.ChuKy %}
                        <img src="{{ vb.ChuKy.url }}" alt="Chữ ký" class="img-preview">
                        {% endif %}

                        <div class="footer-btn">
                            <button type="submit" name="action" value="approve" class="btn-blue">Phê duyệt</button>
                        </div>
                    </div>

                    <div class="field-group" style="margin-top: 25px;">
                        <label>Lý do từ chối (nếu có):</label>
                        <textarea name="ly_do_tu_choi">{{ vb.LyDoTuChoi }}</textarea>

                        <div class="footer-btn">
                            <button type="submit" name="action" value="reject" class="btn-gray">Từ chối</button>
                        </div>
                    </div>

                    <!-- ========================= -->
                    <!--        PHẦN PHÂN CÔNG      -->
                    <!-- ========================= -->

                    <div class="title" style="font-size: 17px;">PHÂN CÔNG XỬ LÝ</div>

                    <div class="field-group">
                        <label>Phân công cho (*):</label>
                        <select name="nguoi_xu_ly">
                            <option value="">-- Chọn người xử lý --</option>
                            {% for user in danh_sach_nguoi_dung %}
                            <option value="{{ user.id }}">{{ user.get_full_name }} ({{ user.email }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field-group" style="margin-top: 15px;">
                        <label>Hạn xử lý (*):</label>
                        <input type="date" name="han_xu_ly" value="{{ vb.HanXuLy|default:'' }}">
                    </div>

                    <div class="field-group" style="margin-top: 15px;">
                        <label>Nội dung phân công (*):</label>
                        <textarea name="noi_dung_phan_cong">{{ vb.NoiDungPhanCong }}</textarea>
                    </div>

                    <div class="footer-btn">
                        <button type="submit" name="action" value="assign" class="btn-blue" style="margin-top: 10px;">
                            Phân công xử lý
                        </button>
                    </div>

                </td>
            </tr>
        </table>
    </form>
</div>

{% endblock %}
