{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>{% block title %}Quản lý văn bản{% endblock %}</title>
 <link rel="stylesheet" href="{% static 'css/style.css' %}">
 <!-- Font Awesome (để có icon đẹp) -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


 <style>
     body {
         font-family: Arial, sans-serif;
         margin: 20px;
         background: #fff;
     }


     /* Thanh menu */
     .navbar {
         display: flex;
         align-items: center;
         justify-content: flex-start;
         background: #f8f8f8;
         padding: 10px 15px;
         border-bottom: 1px solid #ccc;
     }


     .navbar img.logo {
         height: 50px;
         margin-right: 20px;
     }


     .navbar button {
         background: linear-gradient(to bottom, #2a6df4, #0050a0);
         border: 1px solid #333;
         color: white;
         padding: 10px 25px;
         cursor: pointer;
         margin-right: 10px;
         border-radius: 4px;
     }


     .navbar button.active {
         background: #1E90FF;
         color: #fff;
         font-weight: bold;
     }


     /* Biểu tượng thông báo */
     .notification {
         margin-left: auto;
         margin-right: 15px;
         position: relative;
         cursor: pointer;
     }


     .notification .bell {
         font-size: 22px;
         color: #333;
     }


     .notification .badge {
         position: absolute;
         top: -5px;
         right: -5px;
         background: red;
         color: white;
         font-size: 11px;
         border-radius: 50%;
         padding: 2px 5px;
     }


     /* Biểu tượng đăng xuất */
     .logout {
         position: relative;
         cursor: pointer;
     }


     .logout .logout-icon {
         font-size: 22px;
         color: #333;
         transition: 0.3s;
     }


     .logout .logout-icon:hover {
         color: #1E90FF;
     }


     /* Tooltip chữ “Đăng xuất” */
    .logout .logout-icon::after {
        content: "Đăng xuất";
        position: absolute;
        top: 140%;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 14px;
        font-family: Arial, sans-serif !important;
        font-weight: normal;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
        z-index: 9999;
    }






     .logout .logout-icon:hover::after {
         opacity: 1;
     }


     hr {
         border: none;
         border-top: 1px solid #000;
         margin: 10px 0;
     }


     /* Nội dung */
     .filters input,
     .filters select,
     .filters button {
         padding: 5px;
         margin: 5px;
     }


     table {
         width: 100%;
         border-collapse: collapse;
         margin-top: 15px;
     }


     th, td {
         border: 1px solid #000;
         padding: 6px 8px;
         text-align: left;
     }


     th {
         background: #f2f2f2;
     }


     .pagination {
         text-align: center;
         margin-top: 10px;
     }


     .pagination a {
         border: 1px solid #000;
         margin: 0 3px;
         padding: 3px 8px;
         text-decoration: none;
         color: black;
     }


     .pagination a.active {
         background: #1E90FF;
         color: white;
     }
 </style>
</head>
<body>


 <!-- Thanh menu -->
 <div class="navbar">
     <!-- Logo -->
     <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">


     <!-- Các nút -->
     <button class="{% block btn_incoming %}{% endblock %}">Văn bản đến</button>
     <button class="{% block btn_outgoing %}{% endblock %}">Văn bản đi</button>


     <!-- Biểu tượng thông báo -->
     <div class="notification">
         <i class="fa-solid fa-bell"></i>


     </div>


     <!-- Biểu tượng đăng xuất -->
     <div class="logout">
         <i class="fa-solid fa-right-from-bracket logout-icon"></i>
     </div>
 </div>


 <hr>


 <!-- Nội dung -->
 <div class="content">
     {% block content %}{% endblock %}
 </div>


</body>
</html>
