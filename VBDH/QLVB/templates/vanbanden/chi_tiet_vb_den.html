{% block content %}
<style>
  /* ... (CSS giữ nguyên) ... */
  .container {
    margin: 30px auto;
    width: 95%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .btn-blue {
    background-color: #2b579a;
    color: #fff;
    border: none;
    padding: 6px 15px;
    border-radius: 3px;
    font-weight: bold;
  }
  .btn-gray {
    background-color: #dcdcdc;
    border: 1px solid #aaa;
    padding: 6px 15px;
    border-radius: 3px;
  }
  .header-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .title {
    border-bottom: 2px solid #1e4e79;
    font-size: 20px;
    font-weight: bold;
    padding-bottom: 5px;
    margin-bottom: 20px;
    color: #1e4e79;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title-buttons {
    display: flex;
    align-items: center;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  td {
    padding: 6px 10px;
    vertical-align: top;
  }
  label {
    font-weight: bold;
  }
  /* Style chung cho input, textarea, select */
  input[type="text"], textarea, select {
    width: 100%;
    border: 1px solid #999;
    padding: 5px;
    border-radius: 3px;
    box-sizing: border-box;
  }
  textarea {
    height: 60px;
    resize: none;
  }
  /* Style cho ô hiển thị tệp đính kèm (giống input readonly) */
  .file-box-display {
    width: 100%;
    border: 1px solid #999;
    padding: 5px;
    border-radius: 3px;
    background-color: #f8f8f8;
    box-sizing: border-box;
    min-height: 30px;
    display: flex;
    align-items: center;
    word-break: break-all;
  }
  .file-box-display a {
    text-decoration: none;
    color: #1e4e79;
    font-weight: bold;
  }
  /* Các style không liên quan trực tiếp đến form */
  .calendar-box {
    border: 1px solid #999;
    width: 250px;
    padding: 10px;
    margin-left: 15px;
  }
  .calendar-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 5px;
  }
  .calendar-days, .calendar-dates {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 13px;
  }
  .calendar-days div {
    font-weight: bold;
    border-bottom: 1px solid #ccc;
    padding-bottom: 3px;
  }
  .calendar-dates div {
    padding: 3px 0;
  }
  .footer-btn {
    margin-top: 20px;
  }
</style>

<div class="container">
  <div class="header-buttons">
    <div>
      <button class="btn-gray" onclick="window.location.href='{% url 'danh_sach_van_ban_den' %}'">
        ← Quay lại
      </button>
    </div>
    <div>Trạng thái: **{{ vb.TrangThai|default:"Chưa rõ" }}**</div>
    <button class="btn-gray" onclick="window.location.href='{% url 'nhatkyhoatdong' 'vanbanden' vb.id %}'">
      Xem nhật ký hoạt động
    </button>
  </div>

  <div class="title d-flex justify-content-between align-items-center">
    <span>CHI TIẾT VĂN BẢN ĐẾN</span>
    <button class="btn-blue me-2" onclick="window.location.href='{% url 'van_ban_den_update' vb_id=vb.pk %}'" style="background-color: #0078d4;">
    Sửa
</button>

  </div>

  <table>
    <tr>
      <td style="width: 20%;"><label>Trích yếu (*):</label></td>
      <td style="width: 50%;"><textarea readonly>{{ vb.TrichYeu }}</textarea></td>
      <td rowspan="11" style="width: 30%;" valign="top"></td>
    </tr>
    <tr>
      <td><label>Số hiệu (*):</label></td>
      <td><input type="text" readonly value="{{ vb.SoHieu }}"></td>
    </tr>
    <tr>
      <td><label>Loại văn bản:</label></td>
      <td><input type="text" readonly value="{{ vb.LoaiVBDen }}"></td>
    </tr>
    <tr>
      <td><label>Độ mật:</label></td>
      <td><input type="text" readonly value="{{ vb.get_DoMat_display }}"></td>
    </tr>
    <tr>
      <td><label>Độ khẩn:</label></td>
      <td><input type="text" readonly value="{{ vb.get_DoKhan_display }}"></td>
    </tr>
    <tr>
      <td><label>Đơn vị phát hành (*):</label></td>
      <td><input type="text" readonly value="{{ vb.DonViPhatHanh }}"></td>
    </tr>
    <tr>
      <td><label>Ngày phát hành:</label></td>
      <td><input type="text" readonly value="{{ vb.NgayBanHanh|date:'d/m/Y H:i' }}"></td>
    </tr>
    <tr>
      <td><label>Ngày đến:</label></td>
      <td><input type="text" readonly value="{{ vb.NgayDen|date:'d/m/Y H:i' }}"></td>
    </tr>
    <tr>
      <td><label>Nhân viên tạo:</label></td>
      <td>
        <input type="text" readonly value="{% if vb.MaNhanVien %}{{ vb.MaNhanVien.HoTen }}{% else %}Không rõ{% endif %}">
      </td>
    </tr>
    <tr>
      <td><label>Phòng ban:</label></td>
      <td>
        <input type="text" readonly value="{% if vb.MaPhongBan.TenPhongBan %}{{ vb.MaPhongBan.TenPhongBan }}{% else %}{{ vb.MaPhongBan }}{% endif %}">
      </td>
    </tr>
    <tr>
      <td><label>Nội dung:</label></td>
      <td><textarea readonly>{{ vb.NoiDung }}</textarea></td>
    </tr>
    <tr>
      <td><label>Tệp đính kèm:</label></td>
      <td>
        {% if vb.FileDinhKem %}
          <div class="file-box-display">
            <a href="{{ vb.FileDinhKem.url }}" target="_blank" title="{{ file_display_name }}">
              {{ file_display_name }}
            </a>
          </div>
        {% else %}
          <div class="file-box-display" style="background-color: #eee; color: #6c757d;">
            Không có tệp đính kèm
          </div>
        {% endif %}
      </td>
    </tr>
  </table>
</div>
{% endblock %}
