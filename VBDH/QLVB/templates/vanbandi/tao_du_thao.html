{% extends 'base.html' %}
{% load static %}

{% block title %}Tạo dự thảo{% endblock %}
{% block btn_outgoing %}active{% endblock %}

{% block content %}
<div class="draft-header">
  <button class="btn-back">⬅ Quay lại</button>
  <h2>Tạo dự thảo</h2>
  <div class="action-buttons">
      <button class="btn-save">Lưu & Trình ký</button>
      <button class="btn-cancel">Hủy</button>
  </div>
</div>




<form method="POST" enctype="multipart/form-data" class="draft-form">
  {% csrf_token %}
  <table class="form-table">
      <tr>
          <td><label for="number">Số hiệu</label></td>
          <td><input type="text" id="number" name="number" /></td>
      </tr>
      <tr>
          <td><label for="summary">Trích yếu<span class="required">*</span></label></td>
          <td><textarea id="summary" name="summary" rows="3"></textarea></td>
      </tr>
      <tr>
          <td><label for="type">Loại văn bản<span class="required">*</span></label></td>
          <td>
              <select id="type" name="type">
                  <option value="">-- Chọn loại văn bản --</option>
                  <option value="cv">Công văn</option>
                  <option value="tb">Thông báo</option>
                  <option value="bc">Báo cáo</option>
                  <option value="qd">Quyết định</option>
              </select>
          </td>
      </tr>
      <tr>
          <td><label for="incoming_code">Mã văn bản đến</label></td>
          <td>
              <select id="incoming_code" name="incoming_code">
                  <option value="">-- Danh sách yêu cầu --</option>
              </select>
          </td>
      </tr>
      <tr>
          <td><label for="receiver">Đơn vị nhận<span class="required">*</span></label></td>
          <td><input type="text" id="receiver" name="receiver" /></td>
      </tr>
      <tr>
          <td><label for="date">Ngày ban hành<span class="required">*</span></label></td>
          <td><input type="date" id="date" name="date" /></td>
      </tr>
      <tr>
          <td><label for="content">Nội dung</label></td>
          <td><textarea id="content" name="content" rows="4"></textarea></td>
      </tr>
      <tr>
          <td><label for="file">Tệp đính kèm</label></td>
          <td>
              <div class="upload-box">
                  <label for="file" class="upload-label">+ Đăng tải tệp</label>
                  <input type="file" id="file" name="file" hidden>
              </div>
          </td>
      </tr>
  </table>
</form>




<style>
    /* ======== HEADER ======== */
    .draft-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #999;
      padding: 8px 0;
    }
    .draft-header h2 {
      flex-grow: 1;
      text-align: center;
      color: #003d99;
      margin: 0;
    }
    .btn-back {
      background: linear-gradient(to bottom, #2a6df4, #0050a0);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    .action-buttons button {
      margin-left: 8px;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-save {
      background: #2a6df4;
      color: white;
      border: none;
    }
    .btn-cancel {
      background: #f5f5f5;
      border: 1px solid #999;
    }


    /* ======== FORM ======== */
    .draft-form {
      width: 75%;
      margin: 25px auto;
    }
    .form-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* giúp căn thẳng các cột */
    }
    .form-table td {
      padding: 6px 10px;
      vertical-align: middle;
    }
    .form-table td:first-child {
      width: 180px; /* cố định cột label */
      text-align: LEFT; /* label căn phải */
      padding-LEFT: 15px;
      white-space: nowrap;
    }
    .form-table td:last-child {
      width: auto;
    }
    .form-table label {
      font-weight: bold;
      color: #333;
    }
    .required {
      color: red;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #aaa;
      border-radius: 3px;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
    }


    /* ======== FILE UPLOAD ======== */
    .upload-box {
      border: 1px dashed #2a6df4;
      text-align: center;
      padding: 15px;
      cursor: pointer;
      border-radius: 6px;
      width: 60%;
      transition: 0.2s;
    }
    .upload-label {
      color: #2a6df4;
      font-weight: bold;
    }
    .upload-box:hover {
      background: #f0f8ff;
    }
</style>
{% endblock %}
