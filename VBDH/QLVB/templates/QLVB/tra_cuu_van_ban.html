{% load static %}
{% block title %}Tra cứu văn bản{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f6f9;
        font-size: 13px;
    }

    .search-container {
        max-width: 750px;              /*  Thu nhỏ khung chính */
        margin: 30px auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        padding: 20px 25px;
    }

    .search-title {
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        color: #2b4a70;
        margin-bottom: 20px;
        text-transform: uppercase;
    }

    .form-row {
        display: flex;
        gap: 15px;                    /*  Giảm gap */
        margin-bottom: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .form-group label {
        font-weight: 500;
        margin-bottom: 4px;
        font-size: 13px;
    }

    .form-control, .form-select {
        padding: 5px 8px;             /*  Input nhỏ lại */
        border: 1px solid #ced4da;
        border-radius: 5px;
        font-size: 13px;
    }

    .date-range {
        display: flex;
        gap: 10px;
    }

    .button-row {
        display: flex;
        justify-content: flex-end;
        margin-top: 5px;
    }

    .btn-search {
        background-color: #2b579a;
        color: white;
        border: none;
        padding: 6px 20px;            /*  Nút nhỏ gọn hơn */
        border-radius: 5px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-search:hover {
        background-color: #1e3d6d;
    }

    @media (max-width: 768px) {
        .form-row {
            flex-direction: column;
        }
        .date-range {
            flex-direction: column;
        }
        .button-row {
            justify-content: center;
        }
        .btn-search {
            width: 100%;
        }
    }
</style>

<div class="search-container">
    <div class="search-title">Tra cứu văn bản</div>

    <!-- Hàng 1 -->
    <div class="form-row">
        <div class="form-group">
            <label>Từ khóa</label>
            <input id="searchInput" type="text" class="form-control" placeholder="Số ký hiệu, trích yếu...">
        </div>
        <div class="form-group">
            <label>Đơn vị ban hành</label>
            <input id="agency" type="text" class="form-control" placeholder="Nhập đơn vị ban hành">
        </div>
    </div>

    <!-- Hàng 2 -->
    <div class="form-row">
        <div class="form-group">
            <label>Ngày tạo</label>
            <div class="date-range">
                <input id="fromDate" type="text" class="form-control" placeholder="Từ ngày">
                <input id="toDate" type="text" class="form-control" placeholder="Đến ngày">
            </div>
        </div>
        <div class="form-group">
            <label>Phòng ban</label>
            <select id="department" class="form-select">
                <option value="">-- Chọn phòng ban --</option>
            </select>
        </div>
        <div class="form-group">
            <label>Hình thức văn bản</label>
            <select id="docType" class="form-select">
                <option value="">-- Loại văn bản --</option>
                <option>Công văn</option>
                <option>Thông báo</option>
                <option>Quyết định</option>
                <option>Tờ trình</option>
            </select>
        </div>
    </div>

    <!-- Hàng 3 -->
    <div class="button-row">
        <button id="filterBtn" class="btn-search">🔍 Tìm kiếm</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    flatpickr("#fromDate", { dateFormat: "d/m/Y" });
    flatpickr("#toDate", { dateFormat: "d/m/Y" });

    document.getElementById('filterBtn').addEventListener('click', () => {
        alert('Đang lọc dữ liệu...');
    });
</script>
{% endblock %}
