{% block content %}
<style>
  /* DÒNG ĐÃ ĐỔI 1: Thay Times New Roman bằng Segoe UI cho cấu trúc chung */
  .container {
    margin: 30px auto;
    width: 95%;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }

  /* DÒNG ĐÃ ĐỔI 2: Thay Times New Roman bằng Segoe UI cho nút xanh */
  .btn-blue {
    background-color: #2b579a;
    color: #fff;
    border: none;
    padding: 7px 18px;
    border-radius: 3px;
    font-weight: bold;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }

  /* DÒNG ĐÃ ĐỔI 3: Thay Times New Roman bằng Segoe UI cho nút xám */
  .btn-gray {
    background-color: #dcdcdc;
    border: 1px solid #aaa;
    padding: 7px 18px;
    border-radius: 3px;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }
  .header-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  /* DÒNG ĐÃ ĐỔI 4: Thay Times New Roman bằng Segoe UI cho tiêu đề */
  .title {
    border-bottom: 2px solid #1e4e79;
    font-size: 22px;
    font-weight: bold;
    padding-bottom: 5px;
    margin-bottom: 20px;
    color: #1e4e79;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  /* DÒNG ĐÃ ĐỔI 5: Thay Times New Roman bằng Segoe UI cho bảng */
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }
  td {
    padding: 8px 10px;
    vertical-align: top;
  }
  label {
    font-weight: bold;
  }

  /* DÒNG ĐÃ ĐỔI 6: Thay Times New Roman bằng Segoe UI cho trường nhập liệu */
  input[type="text"], textarea, select {
    width: 100%;
    border: 1px solid #999;
    padding: 6px;
    border-radius: 3px;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }
  textarea {
    height: 70px;
    resize: none;
  }
  .footer-btn {
    margin-top: 20px;
  }
</style>

<div class="container">
  <div class="header-buttons">
    <div>
      <button class="btn-gray" onclick="window.history.back()">← Quay lại</button>
    </div>
    <div>Trạng thái:</div>
    <button class="btn-gray">Xem nhật ký hoạt động</button>
  </div>

  <div class="title">CHI TIẾT VĂN BẢN ĐI</div>

  <table>
    <tr>
      <td style="width: 20%;"><label>Trích yếu (*):</label></td>
      <td style="width: 50%;"><textarea readonly>{{ vb.TrichYeu }}</textarea></td>
      <td rowspan="5" style="width: 30%;" valign="top"></td>
    </tr>
    <tr>
      <td><label>Số ký hiệu (*):</label></td>
      <td><input type="text" readonly value="{{ vb.SoKyHieu }}"></td>
    </tr>
    <tr>
      <td><label>Loại văn bản:</label></td>
      <td><input type="text" readonly value="{{ vb.LoaiVanBan }}"></td>
    </tr>
    <tr>
      <td><label>Độ mật:</label></td>
      <td><input type="text" readonly value="{{ vb.DoMat }}"></td>
    </tr>
    <tr>
      <td><label>Độ khẩn:</label></td>
      <td><input type="text" readonly value="{{ vb.DoKhan }}"></td>
    </tr>
    <tr>
      <td><label>Đơn vị phát hành (*):</label></td>
      <td><input type="text" readonly value="{{ vb.CoQuanBanHanh }}"></td>
    </tr>
    <tr>
      <td><label>Ngày phát hành:</label></td>
      <td><input type="text" readonly value="{{ vb.NgayBanHanh }}"></td>
    </tr>
    <tr>
      <td><label>Ngày đến:</label></td>
      <td><input type="text" readonly value="{{ vb.NgayDen }}"></td>
    </tr>
    <tr>
      <td><label>Phòng ban:</label></td>
      <td><input type="text" readonly value="{{ vb.PhongBan }}"></td>
    </tr>
    <tr>
      <td><label>Nội dung:</label></td>
      <td><textarea readonly>{{ vb.NoiDung }}</textarea></td>
    </tr>
    <tr>
      <td><label>Tệp đính kèm:</label></td>
      <td>
        {% if vb.TepDinhKem %}
          <a href="{{ vb.TepDinhKem.url }}" target="_blank">Xem tệp đính kèm</a>
        {% else %}
          <input type="text" readonly value="Không có tệp đính kèm">
        {% endif %}
      </td>
    </tr>
  </table>
</div>
{% endblock %}
